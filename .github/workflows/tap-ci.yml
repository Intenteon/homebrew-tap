# Tap CI: `brew style` over the whole tap; the changed-path allowlist and structural cask check in
# scripts/tap-check.sh (fixture-tested by the tap-fixtures job); and `brew audit --strict --online`
# over each cask or formula a pull request adds or changes.
# Standard: Intenteon/infrastructure docs/cicd/HOMEBREW-TAP-STANDARD.md (issue #1786).
#
# The job id `tap-ci` is the required status-check context in the tap's ruleset. Renaming the job,
# or adding a `name:` to it, changes that context and leaves the required check unsatisfiable.
#
# Runner: GitHub-hosted macos-latest. `brew audit --cask` needs macOS, and hosted macOS minutes are
# free for a public repository. A pull request's cask file is Ruby that `brew audit` evaluates, so
# the job holds a read-only token, no secrets, and no persisted credentials.
name: tap-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tap-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The committed fixture test for scripts/tap-check.sh. It needs no brew, so it runs on Linux.
  tap-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck scripts/tap-check.sh tests/run-fixtures.sh

      - name: Fixture test (includes a positive control that must fail)
        run: bash tests/run-fixtures.sh

  tap-ci:
    # Only `tap-ci` is a required context, and a job skipped by a failed `needs` reads as passing.
    # So tap-ci always runs and fails itself unless tap-fixtures succeeded.
    needs: tap-fixtures
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FIXTURES_RESULT: ${{ needs.tap-fixtures.result }}
    steps:
      - name: Require the fixture test
        run: |
          if [ "$FIXTURES_RESULT" != success ]; then
            echo "::error::tap-fixtures did not succeed (result: $FIXTURES_RESULT)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull_request ref is the merge commit; depth 2 brings both of its parents.
          fetch-depth: 2

      - name: Update Homebrew and link this checkout as intenteon/tap
        run: |
          set -euo pipefail
          brew update --quiet
          taps="$(brew --repository)/Library/Taps/intenteon"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew tap-info intenteon/tap
          # Homebrew refuses to load a cask from an untrusted tap. Trust lets the cask's Ruby run, so a
          # green check is not proof against a hostile cask; the owner's review is. No secrets here.
          brew trust intenteon/tap

      - name: brew style (whole tap, runs even when the tap is empty)
        run: brew style intenteon/tap

      - name: Changed paths, structural cask check, brew audit
        run: |
          set -euo pipefail
          # HEAD is refs/pull/N/merge. Its first parent is main's current tip, so this diff is exactly
          # what the PR adds onto main.
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "::error::HEAD is not a pull-request merge commit; cannot compute the changed files."
            exit 1
          fi
          # Capture the diff first: a git failure inside a pipe would be lost and read as "nothing
          # changed". --raw carries the modes (symlinks); --no-renames splits a rename into D + A.
          changed="$RUNNER_TEMP/changed-raw"
          git diff --raw -z --no-renames --no-abbrev HEAD^1 HEAD > "$changed"
          targets="$RUNNER_TEMP/targets"
          bash scripts/tap-check.sh classify-paths < "$changed" > "$targets"
          if [ ! -s "$targets" ]; then
            echo "::notice::No changed casks or formulas; brew style ran, brew audit has nothing to check."
            exit 0
          fi

          failed=0
          # fd 3, not stdin: brew reading stdin would swallow the remaining targets unaudited.
          while read -r kind name <&3; do
            if [ "$kind" = cask ]; then
              echo "::group::cask $name"
              json="$RUNNER_TEMP/cask-$name.json"
              # --variations: without it the JSON shows only this runner's platform, hiding an
              # on_intel/on_<macos> block's sha256, version or artifacts.
              if bash scripts/tap-check.sh check-pragmas "Casks/$name.rb" &&
                brew info --cask --json=v2 --variations "intenteon/tap/$name" > "$json" &&
                bash scripts/tap-check.sh check-cask-json "$json"; then
                brew audit --cask --strict --online "intenteon/tap/$name" || { echo "::error::brew audit failed: $name"; failed=1; }
              else
                echo "::error::structural cask check failed: $name"
                failed=1
              fi
              echo "::endgroup::"
            else
              # Formulas get brew audit and the owner's review; no structural check (see README).
              echo "::group::formula $name"
              if bash scripts/tap-check.sh check-pragmas "Formula/$name.rb"; then
                brew audit --formula --strict --online "intenteon/tap/$name" || { echo "::error::brew audit failed: $name"; failed=1; }
              else
                failed=1
              fi
              echo "::endgroup::"
            fi
          done 3< "$targets"
          exit "$failed"
